name: Windows Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BalanceIsland-Windows.sln

      - name: Test
        run: dotnet test BalanceIsland-Windows.sln --configuration Release --no-restore

      - name: Build
        run: dotnet build BalanceIsland-Windows.sln --configuration Release --no-restore

      - name: Publish portable x64 build
        run: >-
          dotnet publish src/BalanceIsland.Windows/BalanceIsland.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/win-x64
          -p:PublishSingleFile=true

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: BalanceIsland-Windows-v0.3.0-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
